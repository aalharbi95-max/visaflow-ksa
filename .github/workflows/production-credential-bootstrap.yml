name: Production credential bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  copy-account-token:
    if: github.head_ref == 'codex/release-readiness-20260817'
    runs-on: ubuntu-latest
    environment: staging
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Copy account-level Supabase token to Production environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          printf '%s' "$SUPABASE_ACCESS_TOKEN" | gh secret set SUPABASE_ACCESS_TOKEN \
            --env Production --repo "$GITHUB_REPOSITORY"
