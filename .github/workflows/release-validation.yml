name: Release validation

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate migration inventory
        run: npm run validate:migrations
      - name: Application tests
        run: npm test
      - name: PostgreSQL tests
        run: npm run test:postgres
      - name: Build
        run: npm run build
      - name: Verify clean generated diff
        run: git diff --check
