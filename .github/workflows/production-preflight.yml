name: Production controlled security alignment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run read-only prechecks or apply only the reviewed security migration
        required: true
        type: choice
        options:
          - precheck
          - apply
      confirm_project_ref:
        description: Exact Production project ref
        required: true
        type: string
      confirm_migration_version:
        description: Exact reviewed migration version
        required: true
        type: string
      confirm_commit_sha:
        description: Exact PR head SHA being executed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-security-alignment
  cancel-in-progress: false

jobs:
  controlled-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      PRODUCTION_SECURITY_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact immutable scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "codex/release-readiness-20260817"
          test "${{ inputs.confirm_project_ref }}" = "zeocbftriydodzfgixjv"
          test "$SUPABASE_PROJECT_REF" = "zeocbftriydodzfgixjv"
          test "$SUPABASE_URL" = "https://zeocbftriydodzfgixjv.supabase.co"
          test "${{ inputs.confirm_migration_version }}" = "20260820000100"
          test "${{ inputs.confirm_commit_sha }}" = "$GITHUB_SHA"
          test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Run fail-closed controlled operation
        run: node scripts/production-security-alignment-control.mjs
