name: Production Security Advisor encrypted read-only audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/audit-production-security-advisor-public.pem
      - .github/workflows/production-security-advisor-audit.yml
      - scripts/audit-production-security-advisor-encrypted.mjs

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'codex/release-readiness-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact Production identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "zeocbftriydodzfgixjv"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Capture, sanitize, and encrypt findings in memory
        env:
          PRODUCTION_ADVISOR_AUDIT_OUTPUT: ${{ runner.temp }}/production-security-advisor-audit.enc.json
        run: node scripts/audit-production-security-advisor-encrypted.mjs
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: production-security-advisor-audit-encrypted
          path: ${{ runner.temp }}/production-security-advisor-audit.enc.json
          if-no-files-found: error
          retention-days: 1
      - name: Delete temporary encrypted file
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/production-security-advisor-audit.enc.json"
