name: One-time encrypted Production logical backup 2026-08-21

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Exact Production project ref
        required: true
        type: string
      confirm_commit_sha:
        description: Exact operations commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-logical-backup-20260821
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPECTED_PROJECT_REF: zeocbftriydodzfgixjv
    steps:
      - name: Check out exact operations revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable Production and invocation boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "codex/production-security-remediation-20260821"
          test "${{ inputs.confirm_project_ref }}" = "$EXPECTED_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" = "$EXPECTED_PROJECT_REF"
          test "$SUPABASE_PROJECT_REF" != "iijhdilfzndqlguefipn"
          test "$SUPABASE_URL" = "https://zeocbftriydodzfgixjv.supabase.co"
          test "${{ inputs.confirm_commit_sha }}" = "${{ github.sha }}"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -s .github/production-backup-20260821-public-cert.pem

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Create roles, schema, and data logical dumps
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plain_dir="$RUNNER_TEMP/visaflow-production-backup-plain"
          encrypted_dir="$RUNNER_TEMP/visaflow-production-backup-encrypted"
          mkdir -p "$plain_dir" "$encrypted_dir"
          node scripts/supabase-pooler-cli.mjs db dump --role-only --file "$plain_dir/roles.sql"
          node scripts/supabase-pooler-cli.mjs db dump --file "$plain_dir/schema.sql"
          node scripts/supabase-pooler-cli.mjs db dump --data-only --use-copy --file "$plain_dir/data.sql"
          test -s "$plain_dir/roles.sql"
          test -s "$plain_dir/schema.sql"
          test -s "$plain_dir/data.sql"

      - name: Compress and asymmetrically encrypt backup
        id: encrypt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plain_dir="$RUNNER_TEMP/visaflow-production-backup-plain"
          encrypted_dir="$RUNNER_TEMP/visaflow-production-backup-encrypted"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$plain_dir/visaflow-production-logical-backup-$timestamp.tar.gz"
          encrypted="$encrypted_dir/visaflow-production-logical-backup-$timestamp.tar.gz.cms"
          artifact="visaflow-production-logical-backup-$timestamp-encrypted"
          tar -C "$plain_dir" -czf "$archive" roles.sql schema.sql data.sql
          test -s "$archive"
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$archive" \
            -outform DER \
            -out "$encrypted" \
            .github/production-backup-20260821-public-cert.pem
          test -s "$encrypted"
          openssl cms -cmsout -inform DER -in "$encrypted" -noout
          size_bytes="$(stat -c %s "$encrypted")"
          test "$size_bytes" -gt 0
          {
            echo "artifact_name=$artifact"
            echo "encrypted_path=$encrypted"
            echo "backup_timestamp=$timestamp"
            echo "encrypted_size_bytes=$size_bytes"
          } >> "$GITHUB_OUTPUT"

      - name: Delete all plaintext backup material before upload
        shell: bash
        run: |
          set -euo pipefail
          plain_dir="$RUNNER_TEMP/visaflow-production-backup-plain"
          if [ -d "$plain_dir" ]; then
            find "$plain_dir" -type f -exec shred -u {} +
            rm -rf "$plain_dir"
          fi
          test ! -e "$plain_dir"
          test -s "${{ steps.encrypt.outputs.encrypted_path }}"

      - name: Upload encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.encrypt.outputs.artifact_name }}
          path: ${{ steps.encrypt.outputs.encrypted_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Delete encrypted runner copy
        shell: bash
        run: |
          set -euo pipefail
          encrypted_dir="$RUNNER_TEMP/visaflow-production-backup-encrypted"
          find "$encrypted_dir" -type f -exec shred -u {} +
          rm -rf "$encrypted_dir"

      - name: Cleanup runner material on every outcome
        if: always()
        shell: bash
        run: |
          set +e
          for target in \
            "$RUNNER_TEMP/visaflow-production-backup-plain" \
            "$RUNNER_TEMP/visaflow-production-backup-encrypted"; do
            if [ -d "$target" ]; then
              find "$target" -type f -exec shred -u {} +
              rm -rf "$target"
            fi
          done
