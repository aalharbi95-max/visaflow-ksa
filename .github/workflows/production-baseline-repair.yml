name: Production post-remediation validation

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Exact Production project ref
        required: true
        type: string
      confirm_migration_version:
        description: The only migration authorized to apply
        required: true
        type: string
      confirm_reviewed_sha:
        description: Exact PR 53 reviewed HEAD
        required: true
        type: string
      confirm_backup_artifact_id:
        description: Valid encrypted Production backup artifact id
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: controlled-production-security-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      PRODUCTION_BACKUP_ARTIFACT_ID: ${{ inputs.confirm_backup_artifact_id }}
    steps:
      - name: Check out isolated operations revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable PR, backup, and Production boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "codex/production-security-remediation-20260821"
          test "${{ inputs.confirm_project_ref }}" = "zeocbftriydodzfgixjv"
          test "$SUPABASE_PROJECT_REF" = "zeocbftriydodzfgixjv"
          test "$SUPABASE_PROJECT_REF" != "iijhdilfzndqlguefipn"
          test "$SUPABASE_URL" = "https://zeocbftriydodzfgixjv.supabase.co"
          test "${{ inputs.confirm_migration_version }}" = "20260820000100"
          test "${{ inputs.confirm_reviewed_sha }}" = "7fdf417c9dda3a9b4545ad33672e2e90d0f6a780"
          test "$(gh api repos/aalharbi95-max/visaflow-ksa/pulls/53 --jq .head.sha)" = "${{ inputs.confirm_reviewed_sha }}"
          test "${{ inputs.confirm_backup_artifact_id }}" = "9426185634"
          git cat-file -e "${{ inputs.confirm_reviewed_sha }}^{commit}"
          git diff --exit-code "${{ inputs.confirm_reviewed_sha }}" -- supabase/migrations/20260820000100_production_security_alignment.sql
          git merge-base --is-ancestor acf9c3d07c2fb0a3fd4eb025ebd009d59cf63ca8 "${{ inputs.confirm_reviewed_sha }}"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Confirm PostgreSQL client availability
        run: psql --version

      - name: Verify RLS, view, service role, orphan absence, and history read-only
        run: node scripts/controlled-production-security-remediation.mjs post-verify

      - name: Verify pinned Supabase Security Advisor rules read-only
        run: node scripts/check-production-security-advisor-sql.mjs

      - name: Run rollback-only Company and Agency tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          git show acf9c3d07c2fb0a3fd4eb025ebd009d59cf63ca8:scripts/production-tenant-isolation-smoke.mjs > "$RUNNER_TEMP/production-tenant-isolation-smoke.mjs"
          node scripts/prepare-production-tenant-smoke.mjs "$RUNNER_TEMP/production-tenant-isolation-smoke.mjs"
          PRODUCTION_TENANT_DML_SMOKE=ROLLBACK_ONLY_EXPLICITLY_APPROVED node scripts/run-production-tenant-smoke-pooler.mjs "$RUNNER_TEMP/production-tenant-isolation-smoke.mjs"
          rm -f -- "$RUNNER_TEMP/production-tenant-isolation-smoke.mjs"

      - name: Confirm final bounded migration list
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase-pooler-cli.mjs migration list > "$RUNNER_TEMP/production-migration-list.txt" 2>&1
          node - "$RUNNER_TEMP/production-migration-list.txt" <<'NODE'
          const { readFileSync } = require('node:fs');
          const text = readFileSync(process.argv[2], 'utf8');
          const rows = text.split(/\r?\n/).map((line) => line.split('|'));
          const status = new Map(rows.filter((parts) => parts.length >= 2).map(([local, remote]) => [local.match(/\d{14}/)?.[0], remote.match(/\d{14}/)?.[0]]));
          if (status.get('20260820000100') !== '20260820000100') throw new Error('20260820000100 is not applied');
          if (status.get('20260804000200')) throw new Error('20260804000200 was unexpectedly applied');
          console.log('Final migration list PASS: 20260820000100 applied; 20260804000200 pending.');
          NODE

      - name: Remove temporary runner evidence
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/production-backup-encrypted.zip"
          rm -f -- "$RUNNER_TEMP/production-backup-encrypted.cms"
          rm -f -- "$RUNNER_TEMP/production-orphan-delete-committed"
          rm -f -- "$RUNNER_TEMP/production-security-precheck-state.json"
          rm -f -- "$RUNNER_TEMP/production-security-schema-committed"
          rm -f -- "$RUNNER_TEMP/production-migration-list.txt"
          rm -f -- "$RUNNER_TEMP/production-tenant-isolation-smoke.mjs"
          rm -f -- "$RUNNER_TEMP/production-orphan-read-only-precheck.sql"
          rm -f -- "$RUNNER_TEMP/production-exact-orphan-delete.sql"
          rm -f -- "$RUNNER_TEMP/production-read-only-prechecks.sql"
          rm -f -- "$RUNNER_TEMP/production-security-migration.sql"
          rm -f -- "$RUNNER_TEMP/production-service-role-check.sql"
          rm -f -- "$RUNNER_TEMP/production-security-advisor-read-only.sql"
          rm -f -- "$RUNNER_TEMP"/production-tenant-smoke-*.sql
