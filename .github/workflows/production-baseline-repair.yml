name: One-time read-only Production orphan investigation

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Exact Production project ref
        required: true
        type: string
      confirm_reviewed_sha:
        description: Exact PR 53 reviewed HEAD
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable Production and PR boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "codex/production-security-remediation-20260821"
          test "${{ inputs.confirm_project_ref }}" = "zeocbftriydodzfgixjv"
          test "$SUPABASE_PROJECT_REF" = "zeocbftriydodzfgixjv"
          test "$SUPABASE_PROJECT_REF" != "iijhdilfzndqlguefipn"
          test "$SUPABASE_URL" = "https://zeocbftriydodzfgixjv.supabase.co"
          test "${{ inputs.confirm_reviewed_sha }}" = "3d70d65a57643104aaf57ec54c9446d4a458cf37"
          test "$(gh api repos/aalharbi95-max/visaflow-ksa/pulls/53 --jq .head.sha)" = "${{ inputs.confirm_reviewed_sha }}"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Investigate only the ai_agent_settings orphan read-only
        run: node scripts/investigate-production-ai-agent-settings-orphan.mjs
