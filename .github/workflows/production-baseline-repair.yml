name: One-time read-only Production orphan investigation

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Exact Production project ref
        required: true
        type: string
      confirm_reviewed_sha:
        description: Exact PR 53 reviewed HEAD
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable Production and PR boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = "codex/production-security-remediation-20260821"
          test "${{ inputs.confirm_project_ref }}" = "zeocbftriydodzfgixjv"
          test "$SUPABASE_PROJECT_REF" = "zeocbftriydodzfgixjv"
          test "$SUPABASE_PROJECT_REF" != "iijhdilfzndqlguefipn"
          test "$SUPABASE_URL" = "https://zeocbftriydodzfgixjv.supabase.co"
          test "${{ inputs.confirm_reviewed_sha }}" = "3d70d65a57643104aaf57ec54c9446d4a458cf37"
          test "$(gh api repos/aalharbi95-max/visaflow-ksa/pulls/53 --jq .head.sha)" = "${{ inputs.confirm_reviewed_sha }}"
          test -n "$SUPABASE_ACCESS_TOKEN"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Investigate only the ai_agent_settings orphan read-only
        env:
          ORPHAN_AUDIT_OUTPUT: ${{ runner.temp }}/production-orphan-audit.json
        run: node scripts/investigate-production-ai-agent-settings-orphan.mjs

      - name: Encrypt approved evidence before upload
        shell: bash
        run: |
          set -euo pipefail
          plaintext="$RUNNER_TEMP/production-orphan-audit.json"
          encrypted="$RUNNER_TEMP/production-orphan-audit.json.cms"
          test -s "$plaintext"
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$plaintext" \
            -outform DER \
            -out "$encrypted" \
            .github/production-orphan-audit-public-cert.pem
          test -s "$encrypted"
          openssl cms -cmsout -inform DER -in "$encrypted" -noout
          shred -u "$plaintext"
          test ! -e "$plaintext"

      - name: Upload encrypted approved evidence only
        uses: actions/upload-artifact@v4
        with:
          name: production-orphan-audit-encrypted
          path: ${{ runner.temp }}/production-orphan-audit.json.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove all runner evidence
        if: always()
        shell: bash
        run: |
          set +e
          for target in "$RUNNER_TEMP/production-orphan-audit.json" "$RUNNER_TEMP/production-orphan-audit.json.cms"; do
            if [ -f "$target" ]; then shred -u "$target"; fi
          done
