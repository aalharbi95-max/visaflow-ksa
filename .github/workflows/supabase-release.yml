name: Activate interview library expansion
on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Exact production project for this campaign
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact production destination
        run: |
          test "$CONFIRM_PROJECT_REF" = "zeocbftriydodzfgixjv"
          test "$SUPABASE_PROJECT_REF" = "$CONFIRM_PROJECT_REF"
          test -n "$SUPABASE_ACCESS_TOKEN"
      - run: npm ci
      - name: Validate the isolated campaign
        run: |
          node --test src/interviewExpansion.test.mjs src/juniorAccountantCampaign.test.mjs
          npm run validate:migrations
      - name: Apply the reviewed 90-template expansion and verify existing campaigns
        run: node scripts/activate-interview-expansion.mjs
