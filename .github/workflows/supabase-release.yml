name: Supabase release
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: supabase-production
  cancel-in-progress: false
jobs:
  owner-cv-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test src/ownerGuestCvStats.postgres.test.mjs
      - name: Inspect owner CV counter
        run: node scripts/owner-cv-counter-release.mjs
      - name: Apply owner CV counter migration only
        if: ${{ inputs.apply_migrations }}
        run: node scripts/owner-cv-counter-release.mjs --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-cv-counter-report
          path: owner-cv-counter-report.json
